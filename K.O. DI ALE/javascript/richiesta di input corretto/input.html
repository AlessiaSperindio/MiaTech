<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <p>richiesta di input corretto
        scrivi un ciclo do-while che si ripete fino a quando non inserisci una parola (con il prompt)
        che sia lunga almeno 5 caratteri.
        stampa la parola dopo il ciclo.</p>
    <script src="./input.js">
        let parola;

do {
    parola = prompt("Inserisci una parola di almeno 5 caratteri:");
} while (parola.length < 5);

console.log("Hai inserito la parola:", parola);
    </script>
</body>
</html>
